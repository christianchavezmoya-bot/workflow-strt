# Local Postgres + MinIO for cloud-profile parity testing.
# Sqlite + local disk remain defaults — opt in via launch profiles / appsettings.*Local.json.
services:
  postgres:
    image: postgres:16-alpine
    container_name: commtrac-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: commtrac
      POSTGRES_PASSWORD: commtrac_dev
      POSTGRES_DB: commtrac
    volumes:
      - commtrac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commtrac -d commtrac"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: commtrac-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: commtrac
      MINIO_ROOT_PASSWORD: commtrac_dev
    volumes:
      - commtrac_minio:/data

volumes:
  commtrac_pgdata:
  commtrac_minio:
