name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build            # tsc -b (the only typecheck) + vite bundle
      - run: npm run check:bundle-budget
      - run: npm test                 # vitest run
      # Blocking as of the S1 cleanup: the error-level findings are at zero, so a
      # new one now fails the build. The ~244 warnings remain a deliberate backlog
      # and do not fail — see eslint.config.js for which rules are errors and why.
      - run: npm run lint

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build --nologo
        working-directory: server/Commtrac.Api
      - run: dotnet test --nologo
        working-directory: server/Commtrac.Api.Tests

  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # docs-fresh + hygiene gates via the committed runner
      - run: node .claude/skills/enterprise-dev-practices/scripts/check-gates.mjs docs hygiene

  e2e-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:full

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  e2e-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:perf

  e2e-web-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web-perf
        env:
          WEB_PERF_STRICT: "1"
          WEB_PERF_ASSETS_MS_MAX: "3000"
          WEB_PERF_LOGIN_MS_MAX: "12000"
