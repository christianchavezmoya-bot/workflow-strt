#This file pins the JVM Gradle uses to run its own Daemon (and, absent a
#per-task toolchain, to compile Java/Kotlin sources) for THIS project only.
#
#Root cause this fixes: capacitor-android (vendored into node_modules by the
#@capacitor/android npm package, regenerated on every `npx cap sync` — not
#something we edit directly) declares sourceCompatibility/targetCompatibility
#JavaVersion.VERSION_21. That requires the Gradle Daemon's own javac to be
#JDK 21+. On at least one dev machine, the global ~/.gradle/gradle.properties
#(outside this repo, shared by other projects) pins org.gradle.java.home to a
#JDK 17 install, which cannot compile for release 21 ("invalid source
#release: 21" in :capacitor-android:compileReleaseJavaWithJavac). This file
#is Gradle's supported, project-scoped override for exactly that conflict —
#Gradle resolves it before the project's own gradle.properties is even read,
#so it takes effect regardless of any machine-wide setting, without touching
#any file outside this repo.
#
#Version-only, no vendor pin: any JDK 21 (Temurin, Zulu, Corretto, Microsoft,
#the Android Studio-bundled JetBrains Runtime, etc.) satisfies this — vendor
#pinning was tried and confirmed unnecessary (see PR #361 discussion). Pinning
#to JETBRAINS specifically would break CI runners and other developers' Macs
#that have a JDK 21 from any other distribution, since Gradle's Daemon JVM
#Discovery only matches that exact vendor when one is declared.
toolchainVersion=21
