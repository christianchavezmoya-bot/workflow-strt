<style>

body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif}

.card{position:relative;transition:all 250ms ease;overflow:hidden;border:1px solid var(--border)}

.card:hover{border-color:var(--border2);box-shadow:0 0 20px rgba(0,200,255,.12)}

.b-cyan{color:#00c8ff;border:1px solid rgba(0,200,255,.25);background:rgba(0,200,255,.06)}

.tab-b:hover{color:var(--text)}
.tab-b.active{color:var(--accent);border-bottom-color:var(--accent)}
.dt tr:hover td{background:rgba(0,200,255,.03);color:var(--text)}
.dt th{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);background:var(--surface2)}
.collapse-body{max-height:0;overflow:hidden;transition:max-height 350ms ease}
.collapse-body.open{max-height:5000px}
.sec-divider{height:1px;background:linear-gradient(90deg,var(--border),transparent)}
.glow-c{box-shadow:0 0 20px rgba(0,200,255,.15)}
.glow-g{box-shadow:0 0 20px rgba(0,255,157,.15)}
.glow-o{box-shadow:0 0 20px rgba(255,107,53,.15)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.toast{animation:tIn .2s ease-out,tO .2s ease-in 2.5s forwards}

// FIX: use string concat, never nested backticks
function ic(n, cls, clr) {
  cls = cls || 'w-4 h-4';
  var s = clr ? ' style="color:' + clr + '"' : '';
  return '<i data-lucide="' + n + '" class="' + cls + '"' + s + '></i>';
}
function badge(text, cls) {
  return '<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-mono ' + cls + '">' + text + '</span>';
}
function dot(c) {
  return '<span class="nav-group-dot" style="background:' + (CC[c] || CC.cyan) + '"></span>';
}
function sec(id, title, sub, c) {
  c = c || 'cyan';
  return '<section id="' + id + '" class="mb-[52px] scroll-mt-20 anim-in">' +
    '<div class="sec-divider mb-[52px]"></div>' +
    '<div class="flex items-center gap-3 mb-8">' +
    dot(c) +
    '<div><h2 class="font-heading font-bold text-[22px] leading-tight text-tx">' + title + '</h2>' +
    (sub ? '<p class="text-xs text-tx3 font-mono mt-1">' + sub + '</p>' : '') +
    '</div></div></section>';
}

function buildSidebar() {
  var groups = [['overview','techstack'],['routes','navigation'],['controllers'],['schema','relationships'],['roles','auth'],['directories','integrations','stats']];
  var h = '<div class="mb-4 px-3"><p class="text-[9px] font-mono text-tx3 uppercase tracking-widest">System Map</p></div>';
  groups.forEach(function(g) {
    h += '<div class="mb-3">';
    g.forEach(function(id) {
      var n = NAV.find(function(x){ return x.id === id; });
      h += '<a href="#' + n.id + '" class="nav-link flex items-center gap-2.5 px-3 py-[7px] text-[12px] rounded-r-lg cursor-pointer">' +
        dot(n.color) + '<span class="font-body">' + n.label + '</span></a>';
    });
    h += '</div>';
  });
  document.getElementById('sidebarNav').innerHTML = h;
}

  var totalCols = 0, totalIdx = 0;
  for (tn in TABLES) { totalCols += TABLES[tn].cols.length; totalIdx += TABLES[tn].idx.length; }
  var stats = [['25','Tables','purple','database'],[''+totalCols,'Columns','cyan','columns-3'],[''+totalIdx,'Indexes','amber','hash'],['15','Relationships','purple','git-branch'],[''+totalCtrl,'Controllers','orange','server'],[''+ROUTES.length,'Routes','green','route']];
  h += '<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">';
  for (i = 0; i < stats.length; i++) {
    h += '<div class="card bg-surface rounded-xl p-4 text-center ' + (CG[stats[i][2]] || '') + '">' + ic(stats[i][3], 'w-5 h-5 mx-auto mb-2', CC[stats[i][2]]) + '<p class="text-2xl font-heading font-bold" style="color:' + CC[stats[i][2]] + '">' + stats[i][0] + '</p><p class="text-[9px] text-tx3 uppercase tracking-widest font-mono">' + stats[i][1] + '</p></div>';
  }
  h += '</div>';
  h += '<div class="mt-5 grid md:grid-cols-3 gap-3">';
  var domains = [{t:'Admin Tables',items:'Users, RoleConfigs, Customers, Offices, Products',c:'green',ic:'shield'},{t:'Operational Table',items:'Projects',c:'orange',ic:'folder-kanban'},{t:'Execution Tables',items:'Installations, Inspections, InspectionPhotos, Issues, Documents, Assets',c:'purple',ic:'play'}];
  for (i = 0; i < domains.length; i++) {
    h += '<div class="card bg-surface rounded-xl p-4"><div class="flex items-center gap-2 mb-2">' + ic(domains[i].ic, 'w-4 h-4', CC[domains[i].c]) + '<h4 class="font-heading font-semibold text-[13px] text-tx">' + domains[i].t + '</h4></div><p class="text-[11px] text-tx3 font-body">' + domains[i].items + '</p></div>';
  }
  h += '</div>';
  h += '<div class="mt-3 p-4 bg-ac5/5 border border-ac5/20 rounded-xl"><p class="text-[12px] text-ac5 font-body font-medium mb-1 flex items-center gap-2">' + ic('info','w-3.5 h-3.5',CC.amber) + 'Not present as dedicated tables</p><p class="text-[11px] text-tx3 font-body">Workflows, FormTemplates, FormInstances, InstallationComponents — may exist as code-level constructs or in future schema versions.</p></div>';
  h += '<div class="mt-3 card bg-surface rounded-xl p-5"><h3 class="font-heading font-semibold text-sm text-ac4 mb-3 flex items-center gap-2">' + ic('lightbulb','w-4 h-4') + 'Normalization Opportunities</h3><div class="space-y-1.5">';
  var norms = ['Add explicit FK constraints for all 15 inferred ID references','Replace JSON array columns (ProductIds, AssignedUsers) with junction tables','Replace text weak reference ProjectManager → Users.FullName with ProjectManagerUserId FK','Add child table for installation components instead of Pm1Serial..Pm4Serial','Add unique constraints for business keys (JobNumber, CustomerId)'];
  for (i = 0; i < norms.length; i++) {
    h += '<div class="flex items-start gap-2 text-[12px] text-tx2 font-body">' + ic('arrow-right','w-3 h-3',CC.purple) + '<span>' + norms[i] + '</span></div>';
  }
  h += '</div></div>';

  // ── FOOTER ──
  h += '<div class="sec-divider mt-[52px] mb-8"></div><footer class="pb-12"><div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-[11px] text-tx3 font-body"><div class="flex items-center gap-2"><div class="w-5 h-5 rounded bg-gradient-to-br from-ac to-ac4 flex items-center justify-center">' + ic('layers','w-2.5 h-2.5') + '</div><span>Commtrac Workflow Management</span></div><div class="flex items-center gap-3 font-mono text-[10px]"><span>v0.1.0</span><span class="text-tx3/50">·</span><span>commit c4c5102</span><span class="text-tx3/50">·</span><span>Generated from source</span></div></div></footer>';

  document.getElementById('root').innerHTML = h;
  lucide.createIcons();
}

// ─── INTERACTIONS ─────────────────────────────────────
function toggleSidebar() {
  var s = document.getElementById('sidebar'), o = document.getElementById('overlay');
  s.classList.toggle('-translate-x-full');
  s.classList.toggle('translate-x-0');
  o.classList.toggle('hidden');
}
document.addEventListener('click', function(e) {
  if (window.innerWidth <= 900 && e.target.closest('.nav-link')) toggleSidebar();
});

function toggleCollapse(id) {
  var el = document.getElementById(id);
  var ic = document.getElementById(id + '-icon');
  if (!el) return;
  el.classList.toggle('open');
  if (ic) ic.style.transform = el.classList.contains('open') ? 'rotate(180deg)' : '';
}

function filterSchema(cat, btn) {
  var btns = document.querySelectorAll('.tab-b');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  var tbls = document.querySelectorAll('.schema-tbl');
  for (i = 0; i < tbls.length; i++) {
    tbls[i].style.display = (cat === 'all' || tbls[i].dataset.cat === cat) ? '' : 'none';
  }
}

window.addEventListener('scroll', function() {
  var cur = '';
  for (var i = 0; i < NAV.length; i++) {
    var el = document.getElementById(NAV[i].id);
    if (el && el.getBoundingClientRect().top < 120) cur = NAV[i].id;
  }
  var links = document.querySelectorAll('.nav-link');
  for (i = 0; i < links.length; i++) {
    links[i].classList.toggle('active', NAV[i].id === cur);
  }
  var b = document.getElementById('btt');
  if (window.scrollY > 400) {
    b.style.display = 'flex';
    b.classList.remove('opacity-0', 'pointer-events-none');
    b.classList.add('opacity-100');
  } else {
    b.classList.add('opacity-0', 'pointer-events-none');
    b.classList.remove('opacity-100');
  }
});

function doSearch(q) {
  var marks = document.querySelectorAll('.search-highlight');
  for (var i = 0; i < marks.length; i++) marks[i].outerHTML = marks[i].textContent;
  if (!q.trim()) return;
  var rx = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  var els = document.querySelectorAll('#root p, #root span, #root td, #root h3, #root h4');
  for (i = 0; i < els.length; i++) {
    if (els[i].children.length === 0 && els[i].textContent.toLowerCase().indexOf(q.toLowerCase()) >= 0) {
      els[i].innerHTML = els[i].textContent.replace(rx, '<mark class="search-highlight" style="background:rgba(255,184,48,.25);color:#ffb830;padding:0 2px;border-radius:2px">$1</mark>');
    }
  }
}
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'Escape') { var s = document.getElementById('searchInput'); s.blur(); s.value = ''; doSearch(''); }
});

function downloadPage() {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + document.documentElement.outerHTML], {type: 'text/html'}));
  a.download = 'commtrac-architecture.html';
  a.click();
  URL.revokeObjectURL(a.href);
  var t = document.createElement('div');
  t.className = 'toast bg-surface border border-bdr rounded-lg px-4 py-3 flex items-center gap-2 shadow-xl';
  t.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4 text-ac2"></i><span class="text-xs font-body text-tx">HTML file downloaded!</span>';
  document.getElementById('toast-box').appendChild(t);
  lucide.createIcons();
  setTimeout(function() { t.remove(); }, 3000);
}

// ─── INIT ─────────────────────────────────────────────
buildSidebar();
buildPage();
lucide.createIcons();
</script>
